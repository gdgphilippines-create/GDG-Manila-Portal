server {
    listen 8080;
    server_name localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # This line is CRITICAL for React Router to handle direct URLs (e.g. /schedule)
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets for better performance (Kept from your original)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}